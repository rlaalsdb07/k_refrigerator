# 팀원 D: 매일 아침 08:00 KST (= 23:00 UTC) 유통기한 D-3 임박 알림을 텔레그램으로 전송
# 필요한 Secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
name: D-3 expiry alert (Telegram)

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "며칠 이내 임박 재료를 알릴지"
        default: "3"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Send Telegram alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ARGS="--expiry --days ${{ github.event.inputs.days || '3' }}"
          # 팀원 C의 AI 엔진이 data/recipes.json을 만들면 레시피 카드도 함께 전송
          if [ -f data/recipes.json ]; then ARGS="$ARGS --recipes data/recipes.json"; fi
          python src/main_d.py $ARGS
